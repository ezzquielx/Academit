spring.application.name=academit

# Conexion a base de datos PostgreSQL
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/academit}
spring.datasource.username=${DB_USER:academit}
spring.datasource.password=${DB_PASSWORD:academit}
spring.datasource.driver-class-name=org.postgresql.Driver

# Configuracion de JPA / Hibernate
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true

# Tarea programada de cuotas vencidas (RN07, RF30): todos los dias a las 04:00
# en la zona horaria definida en academit.zone-id (America/Argentina/Tucuman).
academit.cuotas.cron=0 0 4 * * *
