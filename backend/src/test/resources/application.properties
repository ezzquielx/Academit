spring.application.name=academit-test

# Configuracion de dialecto explicita para no depender de JDBC metadata si no hay conexion en tests aislados
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=none

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/academit}
spring.datasource.username=${DB_USER:academit}
spring.datasource.password=${DB_PASSWORD:academit}
spring.datasource.driver-class-name=org.postgresql.Driver

jwt.secret=test-secret-key-that-is-long-enough-for-sha256-signing
jwt.expiration=86400000

