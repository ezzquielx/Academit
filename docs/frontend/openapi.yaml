openapi: 3.0.3
info:
  title: Academit API
  version: 1.0.0
  description: Contrato formal de API REST entre frontend y backend del sistema Academit.
  license:
    name: BSD-3-Clause
    url: https://opensource.org/licenses/BSD-3-Clause
servers:
  - url: /api
    description: Servidor de desarrollo y producción API REST
security:
  - bearerAuth: []
paths:
  /api/alumnos:
    get:
      tags:
        - Alumnos
      summary: "Obtiene el listado completo de alumnos."
      operationId: getAlumnos
      x-roles:
        - ADMINISTRADOR
        - ADMINISTRATIVO
      parameters:
        - name: search
          in: query
          required: false
          description: "Búsqueda por nombre, apellido o DNI"
          schema:
            type: string
        - name: idCarrera
          in: query
          required: false
          description: "Filtro por ID de carrera"
          schema:
            type: integer
        - name: estado
          in: query
          required: false
          description: "Filtro por condición institucional (ACTIVO, INACTIVO)"
          schema:
            type: string
      responses:
        '200':
          description: Consulta o actualización exitosa
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AlumnoDTO'
        '401':
          description: "Credenciales no provistas o inválidas"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '403':
          description: "Acceso denegado para el rol actual"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
    post:
      tags:
        - Alumnos
      summary: "Crea un nuevo alumno en el sistema."
      operationId: createAlumno
      x-roles:
        - ADMINISTRADOR
        - ADMINISTRATIVO
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AlumnoCreateDTO'
      responses:
        '201':
          description: Recurso creado exitosamente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AlumnoDTO'
        '400':
          description: "Solicitud inválida o error en parámetros"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '401':
          description: "Credenciales no provistas o inválidas"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '403':
          description: "Acceso denegado para el rol actual"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '409':
          description: "Conflicto con el estado actual o regla de negocio violada"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
  /api/alumnos/{id}:
    get:
      tags:
        - Alumnos
      summary: "Obtiene un alumno por su ID."
      operationId: getAlumnoById
      x-roles:
        - ADMINISTRADOR
        - ADMINISTRATIVO
      parameters:
        - name: id
          in: path
          required: true
          description: "Identificador único del alumno"
          schema:
            type: integer
      responses:
        '200':
          description: Consulta o actualización exitosa
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AlumnoDTO'
        '401':
          description: "Credenciales no provistas o inválidas"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '403':
          description: "Acceso denegado para el rol actual"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '404':
          description: "Recurso solicitado no encontrado"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
    put:
      tags:
        - Alumnos
      summary: "Actualiza los datos de un alumno existente."
      operationId: updateAlumno
      x-roles:
        - ADMINISTRADOR
        - ADMINISTRATIVO
      parameters:
        - name: id
          in: path
          required: true
          description: "Identificador único del alumno"
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AlumnoUpdateDTO'
      responses:
        '200':
          description: Consulta o actualización exitosa
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AlumnoDTO'
        '400':
          description: "Solicitud inválida o error en parámetros"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '401':
          description: "Credenciales no provistas o inválidas"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '403':
          description: "Acceso denegado para el rol actual"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '404':
          description: "Recurso solicitado no encontrado"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
    delete:
      tags:
        - Alumnos
      summary: "Realiza la baja lógica de un alumno."
      operationId: deleteAlumno
      x-roles:
        - ADMINISTRADOR
      parameters:
        - name: id
          in: path
          required: true
          description: "Identificador único del alumno"
          schema:
            type: integer
      responses:
        '204':
          description: Operación completada sin contenido
        '401':
          description: "Credenciales no provistas o inválidas"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '403':
          description: "Acceso denegado para el rol actual"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '404':
          description: "Recurso solicitado no encontrado"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
  /api/alumnos/{id}/situacion-academica:
    get:
      tags:
