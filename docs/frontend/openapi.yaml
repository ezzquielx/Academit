        '403':
          description: "Acceso denegado para el rol actual"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '404':
          description: "Recurso solicitado no encontrado"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
  /api/alumnos/{id}/situacion-administrativa:
    get:
      tags:
